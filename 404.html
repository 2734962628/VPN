<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面不存在 · Kenny Software</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    :root { --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      font-family: var(--font); background: #f2f4f8; color: #0a101c; text-align: center;
      padding: 32px;
    }
    .mark {
      width: 36px; height: 36px; border-radius: 10px; margin: 0 auto 18px;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(145deg, #1c2434, #0c1018); font-weight: 700;
    }
    h1 { font-size: 28px; letter-spacing: -0.03em; }
    p { margin: 12px 0 24px; color: #5b6880; }
    a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 11px 18px; border-radius: 11px; color: #fff; text-decoration: none;
      background: linear-gradient(178deg, #182131, #090e18);
    }
  </style>
</head>
<body>
  <div>
    <div class="mark">K</div>
    <h1>找不到这个页面</h1>
    <p>链接可能已过期，或地址写错了。</p>
    <a href="./">返回宣传页 →</a>
  </div>
</body>
</html>
